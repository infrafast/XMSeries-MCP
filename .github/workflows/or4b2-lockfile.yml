name: OR4B2 Lockfile

on:
  push:
    branches: ["or4b2-deterministic-gateway"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: or4b2-deterministic-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - run: npm install --package-lock-only
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update OR4B2 dependency lockfile"
          git push origin HEAD:or4b2-deterministic-gateway
