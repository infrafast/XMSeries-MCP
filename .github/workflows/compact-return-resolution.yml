name: Apply compact return target prompt update
"on":
  push:
    branches:
      - docs/compact-return-target-resolution
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prompt
        run: python3 scripts/compact-return-resolution.py
      - name: Validate diff
        run: |
          grep -F 'retour de Claude' PROMPT.md
          grep -F 'only for a real source→destination phrase' PROMPT.md
          git diff --check
      - name: Commit prompt only
        run: |
          rm -f .github/workflows/compact-return-resolution.yml scripts/compact-return-resolution.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROMPT.md .github/workflows/compact-return-resolution.yml scripts/compact-return-resolution.py
          git commit -m 'docs: compact return and bus target resolution [return-resolution-applied]'
          git push
