name: Apply relative level safety patch

on:
  push:
    branches:
      - fix/safe-relative-level-adjust

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - name: Apply patch
        run: python3 scripts/apply-relative-safety.py
      - name: Install and validate
        run: |
          npm ci
          npm run build
          node test-relative-level-safety.mjs
          node test-lifecycle.mjs
          npm run test:name-resolution
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts PROMPT.md test-relative-level-safety.mjs
          git rm scripts/apply-relative-safety.py .github/workflows/apply-relative-level-safety.yml
          git commit -m "feat: make relative level changes atomic and safe [relative-safety-applied]"
          git push
