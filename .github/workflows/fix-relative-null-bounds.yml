name: Fix relative null bounds
"on":
  push:
    branches:
      - fix/relative-null-bounds
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[null-bounds-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch null handling and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          s = s.replace('    minDb?: number;\n    maxDb?: number;\n', '    minDb?: number | null;\n    maxDb?: number | null;\n', 1)
          s = s.replace('if (input.minDb !== undefined && !Number.isFinite(input.minDb))', 'if (input.minDb != null && !Number.isFinite(input.minDb))')
          s = s.replace('if (input.maxDb !== undefined && !Number.isFinite(input.maxDb))', 'if (input.maxDb != null && !Number.isFinite(input.maxDb))')
          s = s.replace('if (input.minDb !== undefined && input.maxDb !== undefined && input.minDb > input.maxDb)', 'if (input.minDb != null && input.maxDb != null && input.minDb > input.maxDb)')
          s = s.replace('if (input.maxDb !== undefined && boundedDb > input.maxDb)', 'if (input.maxDb != null && boundedDb > input.maxDb)')
          s = s.replace('if (input.minDb !== undefined && boundedDb < input.minDb)', 'if (input.minDb != null && boundedDb < input.minDb)')
          p.write_text(s)

          t = Path('test-relative-level-safety.mjs')
          ts = t.read_text()
          marker = 'assert.throws(() => computeRelativeLevelAdjustment(0, { deltaDb: 1 }), /-inf/);\n'
          addition = '''{\n  const r = computeRelativeLevelAdjustment(at(-10), { direction: "down", amount: "normal", minDb: null, maxDb: null });\n  assert.ok(r.targetDb < r.beforeDb);\n  assert.equal(r.minDb, null);\n  assert.equal(r.maxDb, null);\n}\n\n'''
          if addition not in ts:
              ts = ts.replace(marker, addition + marker)
          t.write_text(ts)
          PY
      - name: Validate
        run: |
          npm ci
          npm run build
          node test-relative-level-safety.mjs
          node test-lifecycle.mjs
          npm run test:name-resolution
          git diff --check
      - name: Commit fix only
        run: |
          rm -f .github/workflows/fix-relative-null-bounds.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts test-relative-level-safety.mjs .github/workflows/fix-relative-null-bounds.yml
          git commit -m 'fix: accept null optional relative bounds [null-bounds-fixed]'
          git push
